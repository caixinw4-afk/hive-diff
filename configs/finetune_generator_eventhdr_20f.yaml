# Stage 1b: finetune the Generator on EventHDR real captures (4-bin events, +7 EV LDR target).
# Released: nodistill step 400 (distill weights 0/0) and distill step 600 (0.1 residual / 0.3 encoder, warmup 500).
svd: stabilityai/stable-video-diffusion-img2vid
init: outputs/generator_20f/final/controlnet
output_dir: outputs/generator_20f_eventhdr_ft
data: eventhdr
video_root: /path/to/eventhdr_train      # <clip>/hdr/npy + <clip>/events/npy
num_frames: 20
crop: 512
window_bins: [1, 3, 5, 7]
finetune_warp_seed: 42
batch_size: 1
grad_accum: 16
lr: 5.0e-5
max_steps: 600
distill_residual_weight: 0.1
distill_encoder_weight: 0.3
distill_warmup_steps: 500
checkpoint_every: 200
keep_checkpoints: 3
